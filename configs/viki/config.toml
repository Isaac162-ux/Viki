# ViKi configuration — Personal AI with holographic interface

# ═══════════════════════════════════════════════════════════════
# PILLAR 1: Intelligence — The Model
# ═══════════════════════════════════════════════════════════════
[intelligence]
default_model = ""   # Auto-detect based on hardware
fallback_model = "qwen3.5:4b"          # Catalog alias fallback
preferred_engine = "ollama"            # Local-first default
provider = "local"                     # Running locally on this machine
quantization = "gguf_q4"               # 4-bit quantization for efficiency
# Generation defaults
temperature = 0.7
max_tokens = 2048
top_p = 0.9
top_k = 40
repetition_penalty = 1.0

# ═══════════════════════════════════════════════════════════════
# PILLAR 2: Agent — The Agentic Harness
# ═══════════════════════════════════════════════════════════════
[agent]
default_agent = "simple"               # Lightweight conversation
max_turns = 10                         # Up to 10 tool-calling turns
tools = "calculator,web_search,file_read,think"
objective = "Help the user with accurate, helpful responses"
context_from_memory = true             # Inject relevant memory

# ═══════════════════════════════════════════════════════════════
# PILLAR 3: Tools — MCP Interface
# ═══════════════════════════════════════════════════════════════
[tools.storage]
default_backend = "sqlite"
db_path = "~/.viki/memory.db"

[tools.mcp]
enabled = true

# ═══════════════════════════════════════════════════════════════
# PILLAR 4: Engine — The Inference Runtime
# ═══════════════════════════════════════════════════════════════
[engine]
default = "ollama"

[engine.vllm]
host = "http://localhost:8000"

[engine.ollama]
host = "http://localhost:11434"

[engine.sglang]
host = "http://localhost:30000"

[engine.llamacpp]
host = "http://localhost:8080"

[engine.exo]
host = "http://localhost:52415"

[engine.nexa]
host = "http://localhost:18181"
# device = "npu"  # optional: cpu, gpu, npu

[engine.uzu]
host = "http://localhost:8080"

[engine.apple_fm]
host = "http://localhost:8079"                # OpenAI-compatible shim

# In-process Apple Foundation Models (macOS 26+, Apple Intelligence enabled).
# Install with: uv pip install -e '.[afm]'
[engine.afm]
# instructions = ""                           # applied to every session
# use_case = "general"                        # or "content_tagging"
# guardrails = "default"                      # or "permissive_content_transformations"
sampling = "greedy"                           # or "random" (the SDK default)

# ═══════════════════════════════════════════════════════════════
# PILLAR 5: Learning — Improvement Methodologies
# ═══════════════════════════════════════════════════════════════
[learning]
enabled = false

[learning.routing]
policy = "heuristic"

[learning.intelligence]
policy = "none"

[learning.agent]
policy = "none"

[learning.metrics]
accuracy_weight = 0.6
latency_weight = 0.2
cost_weight = 0.1
efficiency_weight = 0.1

# ═══════════════════════════════════════════════════════════════
# Supporting config
# ═══════════════════════════════════════════════════════════════
[telemetry]
enabled = true
db_path = "~/.viki/telemetry.db"
gpu_metrics = false
gpu_poll_interval_ms = 50
energy_vendor = ""                       # Auto-detect; or force "nvidia"/"amd"/"apple"/"cpu_rapl"
warmup_samples = 0
steady_state_window = 5
steady_state_threshold = 0.05

[traces]
enabled = true
db_path = "~/.viki/traces.db"

[server]
# Bind to loopback by default so the API is not exposed to the local network.
# To serve other devices on your LAN, set host = "0.0.0.0" AND set an API key
# (VIKI_API_KEY / `viki auth generate-key`) — startup refuses a
# non-loopback bind without a key. The "server" security profile also flips
# this to 0.0.0.0 intentionally.
host = "127.0.0.1"
port = 8000
agent = "simple"
